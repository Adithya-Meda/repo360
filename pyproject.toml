[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo360"
dynamic = ["version"]
description = "360-Degree Platform Governance, Compliance & Engineering Intelligence Suite."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Adithya Meda", email = "47377931+Adithya-Meda@users.noreply.github.com" }
]
keywords = [
    "github",
    "governance",
    "security",
    "compliance",
    "dora-metrics",
    "finops",
    "devops",
    "audit",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cryptography>=43.0.0",
    "PyJWT>=2.9.0",
    "requests>=2.32.0",
    "openpyxl>=3.1.2",
    "urllib3>=2.2.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pylint>=3.0.0",
    "black>=24.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Adithya-Meda/repo360"
Repository = "https://github.com/Adithya-Meda/repo360"
Documentation = "https://github.com/Adithya-Meda/repo360#readme"
Issues = "https://github.com/Adithya-Meda/repo360/issues"
Changelog = "https://github.com/Adithya-Meda/repo360/releases"
"Security Policy" = "https://github.com/Adithya-Meda/repo360/blob/main/SECURITY.md"
"Code of Conduct" = "https://github.com/Adithya-Meda/repo360/blob/main/CODE_OF_CONDUCT.md"
"Privacy Notice" = "https://github.com/Adithya-Meda/repo360/blob/main/PRIVACY.md"

[project.scripts]
repo360 = "repo360.main:main"

[tool.setuptools.dynamic]
version = { attr = "repo360.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["repo360*"]

[tool.setuptools.package-data]
"repo360" = ["py.typed", "*.json", "*.md"]

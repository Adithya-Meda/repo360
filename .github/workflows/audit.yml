name: "Repo360 Platform Audit"

on:
  workflow_dispatch:
    inputs:
      os_target:
        description: "Runner OS targets"
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - windows-and-macos
          - all
        default: ubuntu-latest
  schedule:
    - cron: "0 6 * * 1" # Weekly: Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  prepare:
    name: "Select Runner OS Matrix"
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ steps.set_matrix.outputs.os_matrix }}
    steps:
      - id: set_matrix
        shell: bash
        env:
          OS_TARGET: ${{ inputs.os_target || 'ubuntu-latest' }}
        run: |
          case "$OS_TARGET" in
            windows-latest)    echo 'os_matrix=["windows-latest"]' >> "$GITHUB_OUTPUT" ;;
            macos-latest)      echo 'os_matrix=["macos-latest"]' >> "$GITHUB_OUTPUT" ;;
            windows-and-macos) echo 'os_matrix=["windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT" ;;
            all)               echo 'os_matrix=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT" ;;
            *)                 echo 'os_matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT" ;;
          esac

  governance-audit:
    name: "Execute Advisory Audit (${{ matrix.os }})"
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.os_matrix) }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run Repo360 Action"
        uses: ./
        with:
          app_id: ${{ vars.REPO360_APP_ID }}
          private_key: ${{ secrets.REPO360_APP_PRIVATE_KEY }}
          artifact_name: repo360-audit-reports-${{ matrix.os }}
          collect_audit: "true"
          collect_activity: "true"
          collect_runners: "true"
          collect_finops: "true"
          collect_dora: "true"
          collect_bypass: "true"
          require_ai: "yes"
          ai_api_key: ${{ secrets.AI_API_KEY }}
          ai_model: ${{ vars.AI_MODEL }}

name: "Repo360 Platform Audit"

on:
  workflow_dispatch:
    inputs:
      os_matrix:
        description: "JSON array of runner OS labels (e.g. '[\"ubuntu-latest\"]' or '[\"windows-latest\",\"macos-latest\"]')"
        required: false
        default: '["ubuntu-latest"]'
  schedule:
    - cron: "0 6 * * 1" # Weekly: Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  governance-audit:
    name: "Execute Advisory Audit (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.os_matrix || '["ubuntu-latest"]') }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run Repo360 Action"
        uses: ./
        with:
          app_id: ${{ vars.REPO360_APP_ID }}
          private_key: ${{ secrets.REPO360_APP_PRIVATE_KEY }}
          artifact_name: repo360-audit-reports-${{ matrix.os }}
          collect_audit: "true"
          collect_activity: "true"
          collect_runners: "true"
          collect_finops: "true"
          collect_dora: "true"
          collect_bypass: "true"
          require_ai: "yes"
          ai_api_key: ${{ secrets.AI_API_KEY }}
          ai_model: ${{ vars.AI_MODEL }}

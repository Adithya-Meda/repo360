name: "CI"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: "Install Package with Dev and AI Extras"
        run: python -m pip install -e ".[dev,ai]"

      - name: "Run Test Suite"
        run: python -m pytest -q --cov=repo360 --cov-report=term-missing:skip-covered --cov-fail-under=80

  quality:
    name: "Lint, SAST, and Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: "Install Tooling"
        run: python -m pip install -e ".[dev]"

      - name: "Ruff (correctness and security rules)"
        run: ruff check src tests

      - name: "Bandit (medium and high severity)"
        run: bandit -q -r src -ll

      - name: "pip-audit (known CVEs in runtime dependencies)"
        run: pip-audit -r requirements.txt

      - name: "Build and Verify Distribution"
        run: |
          python -m build
          twine check dist/*

  cli-lifecycle:
    name: "CLI Install & Uninstall (${{ matrix.os }})"
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: "Verify pipx Install, Mock Audit, and Clean Uninstall"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --user pipx
          export PATH="$HOME/.local/bin:$PATH"
          pipx install .
          repo360 version
          repo360 audit --mock-mode --require-ai no --output-dir "$RUNNER_TEMP/repo360-e2e"
          ls -lh "$RUNNER_TEMP/repo360-e2e"/*.xlsx
          repo360 uninstall --yes
          hash -r
          if command -v repo360 >/dev/null 2>&1; then
            echo "Error: repo360 still present on PATH after uninstall: $(command -v repo360)" >&2
            exit 1
          fi
          echo "Verified clean uninstall: repo360 removed from PATH."

name: "Repo360"
description: "360-Degree Platform Governance, Compliance, and Engineering Intelligence for GitHub Organizations."
author: "Repo360 Engineering Team"

inputs:
  app_id:
    description: "GitHub App numeric ID"
    required: true
  private_key:
    description: "GitHub App RSA private key (.pem string)"
    required: true
  installation_id:
    description: "GitHub App Installation ID (optional: auto-discovered across all organizations if omitted)"
    required: false
    default: ""
  api_base_url:
    description: "GitHub API Base URL: https://api.github.com for GitHub.com, https://api.<enterprise>.ghe.com for ghe.com, or https://ghe.company.com/api/v3 for GHES."
    required: false
    default: "https://api.github.com"
  org:
    description: "Optional comma-separated list of organizations to audit (e.g. 'org1,org2'). Audits all installed organizations if omitted."
    required: false
    default: ""
  output_dir:
    description: "Directory to save generated Excel reports"
    required: false
    default: "./repo360-output"
  upload_artifact:
    description: "Automatically upload generated reports (.xlsx) as a workflow artifact"
    required: false
    default: "true"
  artifact_name:
    description: "Name of the uploaded workflow artifact"
    required: false
    default: "repo360-audit-reports"
  artifact_retention_days:
    description: "Duration (in days) to retain the uploaded artifact"
    required: false
    default: "60"
  require_ai:
    description: "Enable AI-powered remediation and insights ('yes' or 'no', default: 'no'). Falls back to deterministic policy rules if AI is offline."
    required: false
    default: "no"
  ai_api_key:
    description: "Unified AI API key for any provider (Google Gemini, OpenAI, Anthropic)"
    required: false
    default: ""
  ai_model:
    description: "Optional AI model identifier (e.g. 'gemini-3.5-flash', 'gpt-4o', 'claude-3-5-sonnet-20241022'). Provider is auto-detected from model name."
    required: false
    default: "gemini-3.5-flash"
  collect_activity:
    description: "Collect user activity and contributor metrics ('true' or 'false')"
    required: false
    default: "false"
  collect_runners:
    description: "Collect Actions self-hosted runner fleet metrics ('true' or 'false')"
    required: false
    default: "false"
  collect_finops:
    description: "Profile per-repository storage quotas and Actions artifacts ('true' or 'false')"
    required: false
    default: "false"
  collect_dora:
    description: "Calculate cross-organization DORA delivery flow metrics ('true' or 'false')"
    required: false
    default: "false"
  collect_bypass:
    description: "Audit secret scanning push-protection overrides and ruleset bypasses ('true' or 'false')"
    required: false
    default: "false"
  lookback_days:
    description: "Lookback window in days for user activity and runner metrics"
    required: false
    default: "90"
  gemini_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  openai_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  anthropic_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  llm_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  llm_provider:
    description: "Legacy provider override ('gemini', 'openai', 'anthropic')"
    required: false
    default: ""
  llm_model:
    description: "Legacy alias for ai_model"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Set up Python Environment"
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: "Install Repo360"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: "Execute Repo360 Audit"
      shell: bash
      env:
        REPO360_APP_ID: ${{ inputs.app_id }}
        REPO360_APP_PRIVATE_KEY: ${{ inputs.private_key }}
        REPO360_APP_INSTALLATION_ID: ${{ inputs.installation_id }}
        REPO360_API_BASE_URL: ${{ inputs.api_base_url }}
        AI_API_KEY: ${{ inputs.ai_api_key || inputs.gemini_api_key || inputs.openai_api_key || inputs.anthropic_api_key || inputs.llm_api_key }}
        AI_MODEL: ${{ inputs.ai_model || inputs.llm_model }}
        AI_PROVIDER: ${{ inputs.llm_provider }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        INPUT_REQUIRE_AI: ${{ inputs.require_ai }}
        INPUT_COLLECT_ACTIVITY: ${{ inputs.collect_activity }}
        INPUT_COLLECT_RUNNERS: ${{ inputs.collect_runners }}
        INPUT_COLLECT_FINOPS: ${{ inputs.collect_finops }}
        INPUT_COLLECT_DORA: ${{ inputs.collect_dora }}
        INPUT_COLLECT_BYPASS: ${{ inputs.collect_bypass }}
      run: |
        REQUIRE_AI_VAL="$(printf '%s' "${INPUT_REQUIRE_AI:-no}" | tr '[:upper:]' '[:lower:]')"
        case "$REQUIRE_AI_VAL" in
          yes|no) ;;
          *)
            echo "Error: Invalid require_ai input '$INPUT_REQUIRE_AI'. Expected 'yes' or 'no'." >&2
            exit 1
            ;;
        esac

        COMMON_ARGS=(--output-dir "$INPUT_OUTPUT_DIR" --require-ai "$REQUIRE_AI_VAL")
        if [ -n "$INPUT_ORG" ]; then
          COMMON_ARGS+=(--org "$INPUT_ORG")
        fi

        repo360 audit "${COMMON_ARGS[@]}"

        if [ "$INPUT_COLLECT_ACTIVITY" = "true" ]; then
          repo360 activity "${COMMON_ARGS[@]}" --lookback-days "$INPUT_LOOKBACK_DAYS"
        fi

        if [ "$INPUT_COLLECT_RUNNERS" = "true" ]; then
          repo360 runners "${COMMON_ARGS[@]}" --lookback-days "$INPUT_LOOKBACK_DAYS"
        fi

        if [ "$INPUT_COLLECT_FINOPS" = "true" ]; then
          repo360 finops "${COMMON_ARGS[@]}"
        fi

        if [ "$INPUT_COLLECT_DORA" = "true" ]; then
          repo360 dora "${COMMON_ARGS[@]}" --lookback-days "$INPUT_LOOKBACK_DAYS"
        fi

        if [ "$INPUT_COLLECT_BYPASS" = "true" ]; then
          repo360 bypass "${COMMON_ARGS[@]}" --lookback-days "$INPUT_LOOKBACK_DAYS"
        fi

    - name: "Publish Audit Reports Artifact"
      if: always() && inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.output_dir }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore

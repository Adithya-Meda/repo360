name: "Repo360"
description: "360-Degree Platform Governance, Compliance, and Engineering Intelligence for GitHub Organizations."
author: "Adithya Meda"

inputs:
  app_id:
    description: "GitHub App numeric ID"
    required: true
  private_key:
    description: "GitHub App RSA private key (.pem string)"
    required: true
  installation_id:
    description: "GitHub App Installation ID (optional: auto-discovered across all organizations if omitted)"
    required: false
    default: ""
  api_base_url:
    description: "GitHub API Base URL: https://api.github.com for GitHub.com, https://api.<enterprise>.ghe.com for ghe.com, or https://ghe.company.com/api/v3 for GHES."
    required: false
    default: "https://api.github.com"
  org:
    description: "Optional comma-separated list of organizations to audit (e.g. 'org1,org2'). Audits all installed organizations if omitted."
    required: false
    default: ""
  output_dir:
    description: "Directory to save generated Excel reports"
    required: false
    default: "./repo360-output"
  upload_artifact:
    description: "Automatically upload generated reports (.xlsx) as a workflow artifact"
    required: false
    default: "true"
  artifact_name:
    description: "Name of the uploaded workflow artifact"
    required: false
    default: "repo360-audit-reports"
  artifact_retention_days:
    description: "Duration (in days) to retain the uploaded artifact"
    required: false
    default: "60"
  require_ai:
    description: "Enable AI-powered remediation and insights ('yes' or 'no', default: 'no'). Falls back to deterministic policy rules if AI is offline."
    required: false
    default: "no"
  ai_api_key:
    description: "Unified AI API key for any provider (Google Gemini, OpenAI, Anthropic)"
    required: false
    default: ""
  ai_model:
    description: "User-selected AI model. Required when require_ai is 'yes'."
    required: false
    default: ""
  collect_audit:
    description: "Run platform security and governance compliance audit ('true' or 'false')"
    required: false
    default: "false"
  run_audit:
    description: "Alias for collect_audit ('true' or 'false')"
    required: false
    default: "false"
  collect_activity:
    description: "Collect user activity and contributor metrics ('true' or 'false')"
    required: false
    default: "false"
  collect_runners:
    description: "Collect Actions self-hosted runner fleet metrics ('true' or 'false')"
    required: false
    default: "false"
  collect_finops:
    description: "Profile per-repository storage quotas and Actions artifacts ('true' or 'false')"
    required: false
    default: "false"
  collect_dora:
    description: "Calculate cross-organization DORA delivery flow metrics ('true' or 'false')"
    required: false
    default: "false"
  collect_bypass:
    description: "Audit secret scanning push-protection overrides and ruleset bypasses ('true' or 'false')"
    required: false
    default: "false"
  lookback_days:
    description: "Lookback window in days for activity, runners, dora, and bypass metrics (>=1, or 0 for full history)"
    required: false
    default: "90"
  include_archived:
    description: "Include archived repositories in analysis ('true' or 'false')"
    required: false
    default: "false"
  workers:
    description: "Concurrent worker thread pool count (0 for auto, 1-32)"
    required: false
    default: "0"
  active_min_days:
    description: "Minimum active days for 'Active' contributor tier in activity analysis (1-365)"
    required: false
    default: "8"
  moderate_min_days:
    description: "Minimum active days for 'Moderate' contributor tier in activity analysis (1-365)"
    required: false
    default: "3"
  include_bots:
    description: "Include bot accounts in activity analysis ('true' or 'false')"
    required: false
    default: "false"
  include_forks:
    description: "Include forked repositories in activity analysis ('true' or 'false')"
    required: false
    default: "false"
  include_external:
    description: "Include external/third-party contributors who are not org members in activity analysis ('true' or 'false')"
    required: false
    default: "false"
  prod_envs:
    description: "Optional comma-separated production environment filter for DORA metrics (default: all active deployment environments)"
    required: false
    default: ""
  include_non_prod:
    description: "Include lower/staged deployment environments in DORA metrics ('true' or 'false')"
    required: false
    default: "false"
  incident_labels:
    description: "Optional comma-separated incident issue labels for DORA MTTR (default: built-in incident labels)"
    required: false
    default: ""
  max_runs:
    description: "Max workflow runs per repository to inspect in runners analysis (0 for unlimited full lookback, or 1-1000)"
    required: false
    default: "0"
  timezone:
    description: "Optional timezone name for report timestamps (e.g. 'UTC', 'Asia/Kolkata', 'America/New_York'). Defaults to runner timezone."
    required: false
    default: ""
  gemini_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  openai_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  anthropic_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  llm_api_key:
    description: "Legacy alias for ai_api_key"
    required: false
    default: ""
  llm_provider:
    description: "Legacy provider override ('gemini', 'openai', 'anthropic')"
    required: false
    default: ""
  llm_model:
    description: "Legacy alias for ai_model"
    required: false
    default: ""

outputs:
  output_dir:
    description: "Directory containing generated audit workbooks (.xlsx)"
    value: ${{ inputs.output_dir }}

runs:
  using: "composite"
  steps:
    - name: "Set up Python Environment"
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: "Install Repo360"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"
        repo360 version

    - name: "Execute Repo360 Telemetry"
      shell: bash
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
        REPO360_APP_ID: ${{ inputs.app_id }}
        REPO360_APP_PRIVATE_KEY: ${{ inputs.private_key }}
        REPO360_APP_INSTALLATION_ID: ${{ inputs.installation_id }}
        REPO360_API_BASE_URL: ${{ inputs.api_base_url }}
        REPO360_TIMEZONE: ${{ inputs.timezone }}
        AI_API_KEY: ${{ inputs.ai_api_key || inputs.gemini_api_key || inputs.openai_api_key || inputs.anthropic_api_key || inputs.llm_api_key }}
        AI_MODEL: ${{ inputs.ai_model || inputs.llm_model }}
        AI_PROVIDER: ${{ inputs.llm_provider }}
        INPUT_ORG: ${{ inputs.org }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        INPUT_REQUIRE_AI: ${{ inputs.require_ai }}
        INPUT_COLLECT_AUDIT: ${{ inputs.collect_audit }}
        INPUT_RUN_AUDIT: ${{ inputs.run_audit }}
        INPUT_COLLECT_ACTIVITY: ${{ inputs.collect_activity }}
        INPUT_COLLECT_RUNNERS: ${{ inputs.collect_runners }}
        INPUT_COLLECT_FINOPS: ${{ inputs.collect_finops }}
        INPUT_COLLECT_DORA: ${{ inputs.collect_dora }}
        INPUT_COLLECT_BYPASS: ${{ inputs.collect_bypass }}
        INPUT_INCLUDE_ARCHIVED: ${{ inputs.include_archived }}
        INPUT_WORKERS: ${{ inputs.workers }}
        INPUT_ACTIVE_MIN_DAYS: ${{ inputs.active_min_days }}
        INPUT_MODERATE_MIN_DAYS: ${{ inputs.moderate_min_days }}
        INPUT_INCLUDE_BOTS: ${{ inputs.include_bots }}
        INPUT_INCLUDE_FORKS: ${{ inputs.include_forks }}
        INPUT_INCLUDE_EXTERNAL: ${{ inputs.include_external }}
        INPUT_PROD_ENVS: ${{ inputs.prod_envs }}
        INPUT_INCLUDE_NON_PROD: ${{ inputs.include_non_prod }}
        INPUT_INCIDENT_LABELS: ${{ inputs.incident_labels }}
        INPUT_MAX_RUNS: ${{ inputs.max_runs }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      run: |
        is_true() {
          [ "$(printf '%s' "${1:-false}" | tr '[:upper:]' '[:lower:]')" = "true" ]
        }

        REQUIRE_AI_VAL="$(printf '%s' "${INPUT_REQUIRE_AI:-no}" | tr '[:upper:]' '[:lower:]')"
        case "$REQUIRE_AI_VAL" in
          yes|no) ;;
          *)
            echo "Error: Invalid require_ai input '$INPUT_REQUIRE_AI'. Expected 'yes' or 'no'." >&2
            exit 1
            ;;
        esac

        COMMON_ARGS=(--output-dir "$INPUT_OUTPUT_DIR" --require-ai "$REQUIRE_AI_VAL")
        if [ -n "$INPUT_ORG" ]; then
          COMMON_ARGS+=(--org "$INPUT_ORG")
        fi
        if is_true "$INPUT_INCLUDE_ARCHIVED"; then
          COMMON_ARGS+=(--include-archived)
        fi
        if [ -n "$INPUT_WORKERS" ] && [ "$INPUT_WORKERS" != "0" ]; then
          COMMON_ARGS+=(--workers "$INPUT_WORKERS")
        fi

        FEATURE_COUNT=0

        if is_true "$INPUT_COLLECT_AUDIT" || is_true "$INPUT_RUN_AUDIT"; then
          FEATURE_COUNT=$((FEATURE_COUNT + 1))
          repo360 audit "${COMMON_ARGS[@]}"
        fi

        if is_true "$INPUT_COLLECT_ACTIVITY"; then
          FEATURE_COUNT=$((FEATURE_COUNT + 1))
          ACTIVITY_ARGS=(
            "${COMMON_ARGS[@]}"
            --lookback-days "$INPUT_LOOKBACK_DAYS"
            --active-min-days "${INPUT_ACTIVE_MIN_DAYS:-8}"
            --moderate-min-days "${INPUT_MODERATE_MIN_DAYS:-3}"
          )
          if is_true "$INPUT_INCLUDE_BOTS"; then
            ACTIVITY_ARGS+=(--include-bots)
          fi
          if is_true "$INPUT_INCLUDE_FORKS"; then
            ACTIVITY_ARGS+=(--include-forks)
          fi
          if is_true "$INPUT_INCLUDE_EXTERNAL"; then
            ACTIVITY_ARGS+=(--include-external)
          fi
          repo360 activity "${ACTIVITY_ARGS[@]}"
        fi

        if is_true "$INPUT_COLLECT_RUNNERS"; then
          FEATURE_COUNT=$((FEATURE_COUNT + 1))
          RUNNERS_ARGS=(
            "${COMMON_ARGS[@]}"
            --lookback-days "$INPUT_LOOKBACK_DAYS"
            --max-runs "${INPUT_MAX_RUNS:-0}"
          )
          repo360 runners "${RUNNERS_ARGS[@]}"
        fi

        if is_true "$INPUT_COLLECT_FINOPS"; then
          FEATURE_COUNT=$((FEATURE_COUNT + 1))
          repo360 finops "${COMMON_ARGS[@]}"
        fi

        if is_true "$INPUT_COLLECT_DORA"; then
          FEATURE_COUNT=$((FEATURE_COUNT + 1))
          DORA_ARGS=(
            "${COMMON_ARGS[@]}"
            --lookback-days "$INPUT_LOOKBACK_DAYS"
          )
          if [ -n "$INPUT_PROD_ENVS" ]; then
            DORA_ARGS+=(--prod-envs "$INPUT_PROD_ENVS")
          fi
          if is_true "$INPUT_INCLUDE_NON_PROD"; then
            DORA_ARGS+=(--include-non-prod)
          fi
          if [ -n "$INPUT_INCIDENT_LABELS" ]; then
            DORA_ARGS+=(--incident-labels "$INPUT_INCIDENT_LABELS")
          fi
          repo360 dora "${DORA_ARGS[@]}"
        fi

        if is_true "$INPUT_COLLECT_BYPASS"; then
          FEATURE_COUNT=$((FEATURE_COUNT + 1))
          repo360 bypass "${COMMON_ARGS[@]}" --lookback-days "$INPUT_LOOKBACK_DAYS"
        fi

        if [ "$FEATURE_COUNT" -eq 0 ]; then
          echo "INFO: No collection features enabled. Set at least one feature flag to 'true' (e.g. collect_audit: 'true')."
        elif [ -n "$GITHUB_STEP_SUMMARY" ]; then
          {
            echo "## Repo360 Platform Execution Summary"
            echo ""
            echo "| Scope Parameter | Calculation Policy |"
            echo "| :--- | :--- |"
            echo "| **Repository Scope** | **Source repositories only** (*forked repositories are excluded from calculations by default*) |"
            echo "| **Contributor Scope** | **Organization members only** (*external contributor activities are excluded*) |"
            echo "| **Repository Age Standard** | **New** ($\le$ 180 days / ~6 months) vs **Old** (> 180 days) |"
            echo "| **Output Directory** | \`$INPUT_OUTPUT_DIR\` |"
            echo ""
            echo "All audit reports generated and saved to artifact \`${INPUT_ARTIFACT_NAME:-repo360-audit-reports}\`."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: "Publish Audit Reports Artifact"
      if: always() && inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.output_dir }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore
